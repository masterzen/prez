    <svg width="520" height="280" viewBox="0 0 520 280" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
        </marker>
      </defs>

      <!-- sphere -->
      <ellipse cx="260" cy="140" rx="170" ry="110" fill="none" stroke="#333" stroke-width="2"/>
      <!-- equator -->
      <ellipse cx="260" cy="150" rx="165" ry="55" fill="none" stroke="#777" stroke-width="2" stroke-dasharray="6 6"/>
      <text x="360" y="162" font-family="monospace" font-size="14" fill="#555">équateur céleste</text>

      <!-- poles -->
      <circle cx="260" cy="30" r="4" fill="#333"/>
      <circle cx="260" cy="250" r="4" fill="#333"/>
      <text x="270" y="35" font-family="monospace" font-size="14">+DEC</text>
      <text x="270" y="255" font-family="monospace" font-size="14">-DEC</text>

      <!-- RA arrow along equator -->
      <path d="M120,150 C180,90 340,90 400,150" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="210" y="78" font-family="monospace" font-size="14">RA →</text>

      <!-- DEC arc -->
      <path d="M260,150 C290,135 305,110 305,80" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="312" y="95" font-family="monospace" font-size="14">DEC</text>

      <!-- object point -->
      <circle cx="330" cy="110" r="5" fill="#000"/>
      <text x="340" y="114" font-family="monospace" font-size="14">cible</text>
    </svg>
