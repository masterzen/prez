    <svg width="520" height="280" viewBox="0 0 520 280" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
        </marker>
      </defs>

      <!-- horizon line -->
      <line x1="60" y1="200" x2="460" y2="200" stroke="#333" stroke-width="2"/>
      <text x="240" y="220" font-family="monospace" font-size="14">Horizon</text>

      <!-- observer -->
      <circle cx="260" cy="200" r="5" fill="#333"/>
      <text x="270" y="205" font-family="monospace" font-size="14">obs</text>

      <!-- target -->
      <circle cx="380" cy="95" r="5" fill="#000"/>
      <text x="390" y="100" font-family="monospace" font-size="14">cible</text>

      <!-- altitude angle arc -->
      <path d="M260,200 L380,200" stroke="#777" stroke-width="2" stroke-dasharray="6 6"/>
      <path d="M260,200 L380,95" stroke="#333" stroke-width="2"/>
      <path d="M300,200 A40,40 0 0 1 290,165" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow2)"/>
      <text x="305" y="175" font-family="monospace" font-size="14">Alt</text>

      <!-- azimuth arrow -->
      <path d="M120,240 C180,255 340,255 400,240" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow2)"/>
      <text x="235" y="270" font-family="monospace" font-size="14">Az →</text>

      <!-- cardinal marks -->
      <text x="58" y="196" font-family="monospace" font-size="12">N</text>
      <text x="460" y="196" font-family="monospace" font-size="12">S</text>
      <text x="260" y="188" font-family="monospace" font-size="12" fill="#777">(plan local)</text>
    </svg>
