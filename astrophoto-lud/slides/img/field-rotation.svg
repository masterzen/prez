    <svg width="520" height="280" viewBox="0 0 520 280" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
        </marker>
      </defs>

      <!-- left frame (alt-az) -->
      <rect x="40" y="40" width="200" height="200" fill="none" stroke="#333" stroke-width="2"/>
      <text x="55" y="30" font-family="monospace" font-size="14">Alt/Az</text>
      <circle cx="140" cy="140" r="4" fill="#000"/>
      <text x="148" y="146" font-family="monospace" font-size="12">cible</text>

      <!-- stars rotated -->
      <g stroke="#333" stroke-width="2">
        <line x1="80" y1="90" x2="92" y2="102"/>
        <line x1="92" y1="90" x2="80" y2="102"/>
        <line x1="190" y1="90" x2="202" y2="102"/>
        <line x1="202" y1="90" x2="190" y2="102"/>
        <line x1="80" y1="190" x2="92" y2="202"/>
        <line x1="92" y1="190" x2="80" y2="202"/>
        <line x1="190" y1="190" x2="202" y2="202"/>
        <line x1="202" y1="190" x2="190" y2="202"/>
      </g>

      <!-- rotation arrow -->
      <path d="M165,80 A70,70 0 0 1 205,140" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow3)"/>
      <text x="170" y="75" font-family="monospace" font-size="12">rotation de champ</text>

      <!-- right frame (equatorial) -->
      <rect x="280" y="40" width="200" height="200" fill="none" stroke="#333" stroke-width="2"/>
      <text x="295" y="30" font-family="monospace" font-size="14">Équatoriale</text>
      <circle cx="380" cy="140" r="4" fill="#000"/>
      <text x="388" y="146" font-family="monospace" font-size="12">cible</text>

      <!-- stars stable -->
      <g stroke="#333" stroke-width="2">
        <line x1="320" y1="90" x2="332" y2="102"/>
        <line x1="332" y1="90" x2="320" y2="102"/>
        <line x1="430" y1="90" x2="442" y2="102"/>
        <line x1="442" y1="90" x2="430" y2="102"/>
        <line x1="320" y1="190" x2="332" y2="202"/>
        <line x1="332" y1="190" x2="320" y2="202"/>
        <line x1="430" y1="190" x2="442" y2="202"/>
        <line x1="442" y1="190" x2="430" y2="202"/>
      </g>

      <text x="302" y="260" font-family="monospace" font-size="12" fill="#555">
        Alt/Az: dérotateur requis • Équatoriale: champ stable
      </text>
    </svg>
